name: Déployer Planification d'atelier sur Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer les fichiers à déployer
        run: |
          mkdir -p "$RUNNER_TEMP/deploy/planification-atelier"
          # Copier les fichiers HTML et autres ressources
          cp -v *.html "$RUNNER_TEMP/deploy/planification-atelier/" 2>/dev/null || true
          cp -rv css/ js/ images/ data/ "$RUNNER_TEMP/deploy/planification-atelier/" 2>/dev/null || true
          # Copier la README si elle existe
          cp README.md "$RUNNER_TEMP/deploy/planification-atelier/" 2>/dev/null || true

      - name: Déployer via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFOMANIAK_FTP_SERVER }}
          username: ${{ secrets.INFOMANIAK_FTP_USERNAME }}
          password: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ${{ runner.temp }}/deploy/
          # Domaine tykka-lab.ch -> /sites/tykka-lab.ch/
          # Accessible ensuite via https://tykka-lab.ch/planification-atelier/
          server-dir: /sites/tykka-lab.ch/
          # Fichier d'état DÉDIÉ à ce projet : server-dir est la racine partagée
          # par tous les projets déployés sur ce domaine. Sans state-name propre,
          # tous les workflows lisent/écrasent le même fichier d'état par défaut
          # et se mettent mutuellement en "à supprimer" au déploiement suivant.
          state-name: .ftp-deploy-sync-state.planification-atelier.json
